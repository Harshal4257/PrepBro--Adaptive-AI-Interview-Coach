services:
  - type: web
    name: adaptive-interview-coach-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
      - key: MAX_QUESTIONS
        value: "8"
      - key: INITIAL_DIFFICULTY
        value: Easy
      - key: MINIMUM_SCORE_THRESHOLD
        value: "6.0"
      - key: MAX_QUERY_LENGTH
        value: "12000"
      - key: MAX_ANSWER_LENGTH
        value: "6000"
      - key: MAX_OUTPUT_TOKENS
        value: "700"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      # Streamlit calls the API server-side. Add the deployed frontend origin here
      # if you later call this API directly from a browser.
      - key: ALLOWED_ORIGINS
        value: http://localhost:8501,http://127.0.0.1:8501

  - type: web
    name: adaptive-interview-coach-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: adaptive-interview-coach-api
          type: web
          property: hostport
